name: Validate library

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Local examples and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test workflow logic, baselines, and evidence review
        run: node --test tests/*.test.mjs baselines/tests/*.test.mjs work-samples/control-evidence-review/tests/*.test.mjs
      - name: Verify the pinned research snapshot
        run: python3 research/verify_sync.py
      - name: Regenerate workflow exports and catalog
        run: |
          node scripts/build-workflows.mjs
          node scripts/build-catalog.mjs
          git diff --exit-code -- n8n catalog

  mcp:
    name: MCP protocol sample
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: work-samples/mcp-service-catalog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked sample dependencies
        run: npm ci --ignore-scripts
      - name: Check syntax, protocol behavior, and deterministic answer keys
        run: |
          npm run check
          npm test
          npm run verify:evaluations
